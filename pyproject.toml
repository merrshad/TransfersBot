[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bale-telegram-bridge"
version = "0.1.0"
description = "Asynchronous, multi-user two-way bridge between Telegram and Bale."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "python-telegram-bot>=21,<23",
]

[project.optional-dependencies]
# Sticker rasterisation (webp → png) for media relaying. Optional: without
# Pillow stickers fall back to a text placeholder instead of failing.
media = [
    "Pillow>=10,<12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "Pillow>=10,<12",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["core", "storage", "adapters"]
py-modules = ["config", "healthcheck", "logging_setup", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "data", "build", "dist", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
# Default correctness rules (pyflakes/pycodestyle) plus import order and
# modern-Python upgrades. Deliberately not "ALL": the project prefers a small,
# meaningful gate over stylistic churn.
select = ["E4", "E7", "E9", "F", "I", "UP"]
# ``(str, Enum)`` is kept for compatibility with JSON/sqlite adapters that
# already store ``.value``; migrating to StrEnum is a separate behavioural
# change, not a lint fix.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["adapters", "core", "storage", "config", "logging_setup", "main"]

[tool.mypy]
python_version = "3.12"
files = [
    "config.py",
    "healthcheck.py",
    "core",
    "storage",
    "adapters",
    "logging_setup.py",
    "main.py",
]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["core", "storage", "config"]
omit = ["tests/*"]
